<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido de Materiales</title>
<style>
:root{
  --cian:#2bb6e9; --cian-d:#1a8fbe; --bord:#642530; --gris:#616161;
  --bar:#22303c; --bg:#e6e9ec; --ok:#1e7b3a; --warn:#b26a00; --mal:#b3261e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1c1c1c;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select,textarea{font:inherit}

/* ===== barra superior (pantalla) ===== */
.topbar{background:var(--bar);color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;position:sticky;top:0;z-index:20}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
.topbar .sp{flex:1}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:1px solid #ffffff44;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.tab.on{background:var(--cian);border-color:var(--cian);color:#06222e;font-weight:700}
.usr{display:flex;align-items:center;gap:6px;font-size:12px}
.usr input{background:#ffffff18;border:1px solid #ffffff44;color:#fff;border-radius:5px;padding:5px 7px;width:150px}
.usr input::placeholder{color:#ffffff99}
.guardado{font-size:12px;color:#9fe2b6}

.acciones{display:flex;flex-wrap:wrap;gap:8px;max-width:210mm;margin:10px auto 0;padding:0 8px}
.btn{border:1px solid #b9c0c7;background:#fff;color:#22303c;border-radius:6px;padding:8px 13px;cursor:pointer;font-size:13px}
.btn:hover{background:#f3f6f8}
.btn.p{background:var(--cian-d);border-color:var(--cian-d);color:#fff;font-weight:700}
.btn.p:hover{background:#157aa3}
.btn.s{padding:5px 9px;font-size:12px}

/* ===== hoja ===== */
.zoomer{transform-origin:top center}
.sheet{width:210mm;min-height:297mm;margin:10px auto 24px;background:#fff;box-shadow:0 2px 14px #0003;display:flex;flex-direction:column}
.sheet img.hdr,.pg img.hdr{display:block;width:100%;height:auto}
.ft{position:relative}
.ft img.ftr{display:block;width:100%;height:auto}
.ft img.esc{position:absolute;left:50%;bottom:0;width:12.4mm;height:auto;transform:translateX(-50%)}
.sbody{flex:1;padding:5mm 22mm 8mm;font-size:11pt;line-height:1.35}

.fecha-l{text-align:right;font-weight:700;margin:4mm 0 9mm;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.fecha-l input{border:1px dashed #b9c0c7;border-radius:4px;padding:3px 5px;font-weight:700}
.ed{border:1px solid transparent;background:transparent;border-radius:3px;padding:2px 4px;width:100%;color:inherit}
.ed:hover{border-color:#cfd6dc}
.ed:focus{outline:none;border-color:var(--cian);background:#f4fbff}
.dest{font-weight:700;font-size:11.5pt}
textarea.ed{resize:vertical;min-height:2.6em;line-height:1.35}
.intro{margin:5mm 0 8mm;text-indent:40mm}
.sec{margin-bottom:5mm}
.sec-h{display:flex;gap:6px;align-items:center}
.sec-t{font-weight:700;text-decoration:underline;width:100%}
.it{display:grid;grid-template-columns:14px 58px 1fr 128px 22px;gap:4px 5px;align-items:center;padding:2px 0 2px 14px;border-left:3px solid transparent;margin-left:2px}
.it .dot{text-align:center}
.it input.q{text-align:center}
.it select{border:1px solid #cfd6dc;border-radius:4px;padding:3px 2px;font-size:11px;background:#fff;width:100%}
.it .sub{grid-column:2 / 5;display:flex;gap:6px;align-items:center;font-size:11px;color:#555}
.it .sub label{white-space:nowrap}
.it .sub input{border:1px solid #cfd6dc;border-radius:4px;padding:3px 6px;font-size:12px;width:100%}
.it.st-ent{border-left-color:var(--ok)} .it.st-ent select{color:var(--ok);font-weight:700}
.it.st-parc{border-left-color:var(--warn)} .it.st-parc select{color:var(--warn);font-weight:700}
.it.st-no{border-left-color:var(--mal);background:#fdf0ef} .it.st-no select{color:var(--mal);font-weight:700}
.it.falta .mot{border-color:var(--mal);background:#fff4f3}
.x{border:none;background:transparent;color:#9a9a9a;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px}
.x:hover{color:var(--mal);background:#fdecea}
.add{margin:3px 0 0 22px;border:1px dashed #b9c0c7;background:#fff;color:#4c6272;border-radius:5px;padding:3px 10px;font-size:12px;cursor:pointer}
.add:hover{border-color:var(--cian-d);color:var(--cian-d)}
.addsec{margin:2mm 0 6mm;border:1px dashed var(--cian-d);background:#f4fbff;color:var(--cian-d);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13px}
.firma-l{font-weight:700;text-decoration:underline;margin-top:8mm}
.obs-l{margin-top:6mm;font-size:11px;color:#555}
.ref{margin-top:6mm;text-align:right;font-size:8pt;color:#8a8a8a}

/* ===== historial ===== */
.panel{max-width:210mm;margin:12px auto 40px;padding:0 8px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 5px #0002;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:14px}
.card .meta{font-size:12px;color:#555}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.chip{font-size:11px;border-radius:10px;padding:2px 8px;border:1px solid #ccd}
.chip.ent{background:#e7f5ec;color:var(--ok);border-color:#bfe3cb}
.chip.parc{background:#fff3df;color:var(--warn);border-color:#f0d9a8}
.chip.no{background:#fdecea;color:var(--mal);border-color:#f3c3be}
.chip.pend{background:#eef0f2;color:#555}
.card .row{display:flex;flex-wrap:wrap;gap:6px}
.buscar{width:100%;padding:9px 11px;border:1px solid #b9c0c7;border-radius:6px;margin-bottom:10px}
.vacio{text-align:center;color:#667;padding:30px 10px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#22303c;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.toast.mal{background:var(--mal)}

/* ===== contenido impreso / vista previa del informe ===== */
table.pg{width:210mm;border-collapse:collapse;background:#fff;color:#000;font-size:11pt;line-height:1.35}
table.pg>thead>tr>td,table.pg>tfoot>tr>td{padding:0}
table.pg>tbody>tr>td.pb{padding:4mm 22mm 6mm;vertical-align:top}
.pn-fecha{text-align:right;font-weight:700;margin:4mm 0 9mm}
.pn-dest{font-weight:700;font-size:11.5pt}
.pn-intro{margin:5mm 0 8mm;text-indent:40mm;white-space:pre-wrap}
.pn-sec{margin-bottom:5mm;break-inside:avoid}
.pn-sec h4{margin:0 0 1mm;font-size:11pt;text-decoration:underline}
.pn-sec ul{margin:0;padding-left:11mm}
.pn-sec li{margin:0}
.pn-firma{font-weight:700;text-decoration:underline;margin-top:8mm;break-inside:avoid}
.pn-obs{margin-top:6mm;white-space:pre-wrap}
.pn-ref{margin-top:6mm;text-align:right;font-size:8pt;color:#777}
.b-no{color:var(--mal);font-weight:700}
.b-parc{color:var(--warn);font-weight:700}
.b-ent{color:var(--ok)}

.inf h2{margin:2mm 0 1mm;font-size:15pt;color:var(--bord);text-align:center;letter-spacing:.3px}
.inf .sub1{text-align:center;color:#444;font-size:10pt;margin-bottom:4mm}
.inf h5{margin:5mm 0 1.5mm;font-size:10.5pt;color:var(--bord);border-bottom:1.5px solid var(--bord);padding-bottom:1mm;break-after:avoid}
.inf table{width:100%;border-collapse:collapse;font-size:9.5pt}
.inf td,.inf th{border:1px solid #9aa3aa;padding:1.4mm 2mm;text-align:left;vertical-align:top}
.inf th{background:#e9eef2;font-weight:700}
.inf tr{break-inside:avoid}
.inf .kv td:first-child{width:38mm;background:#f2f5f7;font-weight:700}
.inf .gr td{background:#dfe9ef;font-weight:700}
.inf .estado{margin:3mm 0;padding:2.2mm;text-align:center;font-weight:700;font-size:11pt;border:2px solid}
.inf .estado.ok{color:var(--ok);border-color:var(--ok);background:#eaf6ee}
.inf .estado.warn{color:var(--warn);border-color:var(--warn);background:#fff6e5}
.inf .estado.mal{color:var(--mal);border-color:var(--mal);background:#fdecea}
.inf .estado.pend{color:#444;border-color:#888;background:#f1f1f1}
.inf .num{text-align:center}
.inf .rojo{color:var(--mal);font-weight:700}
.inf .ambar{color:var(--warn);font-weight:700}
.inf .verde{color:var(--ok);font-weight:700}
.inf .firmas{display:flex;gap:10mm;margin-top:16mm;break-inside:avoid}
.inf .firmas div{flex:1;border-top:1px solid #000;text-align:center;font-size:9pt;padding-top:1mm}
.inf .gen{font-size:8pt;color:#666;margin-top:4mm}

#printArea{display:none}

/* ===== impresión ===== */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  .app{display:none!important}
  #printArea{display:block}
  body[data-print="nota"] #printInforme{display:none}
  body[data-print="informe"] #printNota{display:none}
  table.pg{height:297mm}
  .toast{display:none}
}
@media (max-width:820px){
  .usr input{width:110px}
}
</style>
</head>
<body data-print="nota">

<div class="app">
  <div class="topbar">
    <h1>📄 Pedido de Materiales</h1>
    <div class="tabs">
      <button class="tab on" data-v="nota">✏️ Nota</button>
      <button class="tab" data-v="informe">📑 Informe</button>
      <button class="tab" data-v="hist">🗂️ Historial</button>
    </div>
    <div class="sp"></div>
    <div class="usr"><label for="usuario">Imprime:</label><input id="usuario" placeholder="Tu nombre" autocomplete="off"></div>
    <div class="guardado" id="guardado"></div>
  </div>

  <!-- ===== VISTA: NOTA ===== -->
  <div id="v-nota">
    <div class="acciones">
      <button class="btn p" id="bPrintNota">🖨️ Imprimir nota</button>
      <button class="btn" id="bNueva">📄 Nota nueva (en blanco)</button>
      <button class="btn" id="bDup">⧉ Duplicar como nota nueva</button>
    </div>
    <div class="zoomer" id="zNota">
      <div class="sheet">
        <img class="hdr js-hdr" alt="Lanús Gobierno">
        <div class="sbody">
          <div class="fecha-l"><span>LANÚS</span><input type="date" id="f-fecha"></div>
          <input class="ed dest" id="f-dest" placeholder="Destinatario">
          <textarea class="ed intro" id="f-intro" rows="3"></textarea>
          <div id="secciones"></div>
          <button class="addsec" id="bAddSec">+ Agregar cuadrilla / sección</button>
          <input class="ed firma-l" id="f-firma" placeholder="Firma">
          <div class="obs-l">Observaciones (opcional, se imprime si completás algo):</div>
          <textarea class="ed" id="f-obs" rows="2" placeholder="Ej: se pide urgente por obra en Av. Hipólito Yrigoyen"></textarea>
        </div>
        <div class="ft"><img class="ftr js-ftr" alt=""><img class="esc js-esc" alt=""></div>
      </div>
    </div>
  </div>

  <!-- ===== VISTA: INFORME ===== -->
  <div id="v-informe" style="display:none">
    <div class="acciones">
      <button class="btn p" id="bPrintInf">🖨️ Imprimir informe</button>
      <span style="font-size:12px;color:#555;align-self:center">Se arma solo con lo que cargaste en la nota (estado de cada material, motivos e impresiones).</span>
    </div>
    <div class="zoomer" id="zInf"><div id="prevInforme" style="width:210mm;margin:10px auto 24px;box-shadow:0 2px 14px #0003"></div></div>
  </div>

  <!-- ===== VISTA: HISTORIAL ===== -->
  <div id="v-hist" style="display:none">
    <div class="panel">
      <input class="buscar" id="buscar" placeholder="Buscar por material, cuadrilla, motivo, fecha…">
      <div class="row" style="margin-bottom:10px">
        <button class="btn s" id="bExp">⬇️ Respaldo (JSON)</button>
        <button class="btn s" id="bImp">⬆️ Importar respaldo</button>
        <input type="file" id="fImp" accept="application/json" style="display:none">
      </div>
      <div id="lista"></div>
    </div>
  </div>
</div>

<!-- ===== ÁREA DE IMPRESIÓN ===== -->
<div id="printArea">
  <div id="printNota"></div>
  <div id="printInforme"></div>
</div>

<datalist id="dlMat"></datalist>
<datalist id="dlCuad"></datalist>
<div class="toast" id="toast"></div>

const SING = { bolsas:'bolsa', panes:'pan', varillas:'varilla', palas:'pala', picos:'pico', palos:'palo', cintas:'cinta', garrafas:'garrafa', guantes:'guante', rollos:'rollo', cajas:'caja', bidones:'bidón', litros:'litro', kilos:'kilo', metros:'metro', tambores:'tambor', unidades:'unidad', toneladas:'tonelada', baldes:'balde', carretillas:'carretilla', cucharas:'cuchara' };
const PLUR = Object.fromEntries(Object.entries(SING).map(([p,s])=>[s,p]));

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = (n,l=2) => String(n).padStart(l,'0');
const hoy = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function fechaNota(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${pad(parseInt(d,10))} de ${MESES[parseInt(m,10)-1]}`; }
function fechaCorta(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fechaHora(ts){ const d=new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function toast(msg, mal){ const t=$('toast'); t.textContent=msg; t.className='toast on'+(mal?' mal':''); clearTimeout(toast._t); toast._t=setTimeout(()=>t.className='toast',2800); }

/* Concordancia 1 bolsa / 2 bolsas (solo cuando el texto es "<unidad> de ..." o una sola palabra) */
function textoItem(it){
  const cant = String(it.cant||'').trim();
  let tx = String(it.texto||'').trim();
  const n = parseFloat(cant.replace(',','.'));
  const m = tx.match(/^(\S+)(\s+de\s+.*)?$/i);
  if(m && !isNaN(n)){
    const w = m[1], wl = w.toLowerCase();
    let nw = w;
    if(n===1 && SING[wl]) nw = SING[wl];
    else if(n>1 && PLUR[wl]) nw = PLUR[wl];
    if(nw!==w){ if(w[0]===w[0].toUpperCase()) nw = nw[0].toUpperCase()+nw.slice(1); tx = nw + (m[2]||''); }
  }
  return (cant+' '+tx).trim();
}

/* ---------- datos ---------- */
let DB = { notas:{}, counter:0, actual:null, usuario:'' };
function cargar(){
  try{ const r = localStorage.getItem(KEY); if(r) DB = Object.assign(DB, JSON.parse(r)); }catch(e){ console.warn('localStorage no disponible', e); }
}
let _saveT=null;
function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); $('guardado').textContent='✓ Guardado '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ $('guardado').textContent='⚠️ No se pudo guardar'; toast('No se pudo guardar en este navegador. Hacé un respaldo (Historial).', true); }
}
function guardarSoon(){ clearTimeout(_saveT); _saveT=setTimeout(guardar,300); }

function nuevaNota(conEjemplo){
  DB.counter++;
  const n = { id:uid(), num:DB.counter, creada:Date.now(), modificada:Date.now(), fecha:hoy(),
    destinatario:'DIRECCION GENERAL DE OBRAS', intro:INTRO_DEF, firma:'Dirección De Ejecución en red vial', observaciones:'',
    secciones:[], impresiones:[] };
  if(conEjemplo){
    const S=(t,items)=>({id:uid(),titulo:t,items:items.map(([c,x])=>({id:uid(),cant:c,texto:x,estado:'pend',entregado:'',motivo:''}))});
    n.secciones=[
      S('Albañilería Frutos',[['2','bolsas de cemento']]),
      S('Albañilería Marcelino',[['2','bolsas de cemento'],['1','varilla']]),
      S('Bacheo Claudio',[['1','bolsa de cal'],['10','guantes moteados']]),
      S('Bacheo Meza',[['1','bolsa de cal'],['1','pala ancha'],['1','pico']]),
      S('Bacheo Melian',[['2','palos de rastrillo']]),
      S('Emulsión',[['1','bolsa de cal']]),
      S('Sellado de Juntas Aquino',[['1','bolsa de cal'],['7','panes de brea'],['1','garrafa de 45']]),
      S('Sellado de Juntas 2',[['1','bolsa de cal'],['7','panes de brea']]),
      S('General',[['5','cintas de peligro']])
    ];
  }
  DB.notas[n.id]=n; DB.actual=n.id; guardar(); return n;
}
let nota;
function notaActual(){ return DB.notas[DB.actual]; }

function resumen(n){
  const r={total:0,pend:0,ent:0,parc:0,no:0};
  n.secciones.forEach(s=>s.items.forEach(it=>{ r.total++; r[it.estado||'pend']++; }));
  return r;
}
function estadoGeneral(r){
  if(!r.total) return {cls:'pend',txt:'SIN MATERIALES CARGADOS'};
  if(r.pend>0) return {cls:'pend',txt:`ENTREGA PENDIENTE — ${r.pend} ítem(s) sin confirmar${(r.no+r.parc)?` · ${r.no} no entregado(s), ${r.parc} parcial(es)`:''}`};
  if(r.no+r.parc>0) return {cls:(r.no?'mal':'warn'),txt:`ENTREGA INCOMPLETA — ${r.no} NO ENTREGADO(S) · ${r.parc} PARCIAL(ES)`};
  return {cls:'ok',txt:'ENTREGA COMPLETA — todos los materiales fueron entregados'};
}

/* ---------- editor ---------- */
function estOpts(sel){ return Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v}</option>`).join(''); }
function itemHtml(it,si,ii){
  const st = it.estado||'pend';
  const falta = (st==='parc'||st==='no') && !String(it.motivo||'').trim();
  return `<div class="it st-${st}${falta?' falta':''}" data-s="${si}" data-i="${ii}">
    <span class="dot">•</span>
    <input class="ed q" data-f="cant" inputmode="decimal" value="${esc(it.cant)}" placeholder="0">
    <input class="ed" data-f="texto" list="dlMat" value="${esc(it.texto)}" placeholder="ej: bolsas de cemento">
    <select data-f="estado">${estOpts(st)}</select>
    <button class="x" data-act="delItem" title="Quitar material">✕</button>
    ${st==='parc'?`<div class="sub"><label>Entregaron</label><input data-f="entregado" inputmode="decimal" style="width:70px" value="${esc(it.entregado)}" placeholder="cant."></div>`:''}
    ${(st==='parc'||st==='no')?`<div class="sub"><label>Motivo</label><input class="mot" data-f="motivo" value="${esc(it.motivo)}" placeholder="${st==='no'?'¿Por qué NO se entregó? (obligatorio)':'¿Por qué se entregó incompleto? (obligatorio)'}"></div>`:''}
  </div>`;
}
function renderSecciones(){
  $('secciones').innerHTML = nota.secciones.map((s,si)=>`
    <div class="sec" data-s="${si}">
      <div class="sec-h"><input class="ed sec-t" data-f="titulo" list="dlCuad" value="${esc(s.titulo)}" placeholder="Cuadrilla / sección"><button class="x" data-act="delSec" title="Quitar toda la sección">✕</button></div>
      ${s.items.map((it,ii)=>itemHtml(it,si,ii)).join('')}
      <button class="add" data-act="addItem">+ material</button>
    </div>`).join('');
}
function renderEditor(){
  $('f-fecha').value = nota.fecha;
  $('f-dest').value = nota.destinatario;
  $('f-intro').value = nota.intro;
  $('f-firma').value = nota.firma;
  $('f-obs').value = nota.observaciones||'';
  renderSecciones(); actualizarListas();
}
function actualizarListas(){
  const mats=new Set(MAT_DEF), cuad=new Set(CUAD_DEF);
  Object.values(DB.notas).forEach(n=>n.secciones.forEach(s=>{ if(s.titulo) cuad.add(s.titulo); s.items.forEach(it=>{ if(it.texto) mats.add(it.texto); }); }));
  $('dlMat').innerHTML=[...mats].sort((a,b)=>a.localeCompare(b,'es')).map(x=>`<option value="${esc(x)}">`).join('');
  $('dlCuad').innerHTML=[...cuad].sort((a,b)=>a.localeCompare(b,'es')).map(x=>`<option value="${esc(x)}">`).join('');
}
function touch(){ nota.modificada=Date.now(); guardarSoon(); }

/* ---------- eventos del editor ---------- */
['f-fecha:fecha','f-dest:destinatario','f-intro:intro','f-firma:firma','f-obs:observaciones'].forEach(p=>{
  const [id,k]=p.split(':'); $(id).addEventListener('input',e=>{ nota[k]=e.target.value; touch(); });
});
$('secciones').addEventListener('input',e=>{
  const f=e.target.dataset.f; if(!f||f==='estado') return;
  const secEl=e.target.closest('.sec'); const s=nota.secciones[+secEl.dataset.s];
  const itEl=e.target.closest('.it');
  if(itEl){ const it=s.items[+itEl.dataset.i]; it[f]=e.target.value;
    if(f==='motivo'){ itEl.classList.toggle('falta', !String(it.motivo||'').trim()); }
  } else { s[f]=e.target.value; }
  touch();
});
$('secciones').addEventListener('change',e=>{
  if(e.target.dataset.f==='estado'){
    const s=nota.secciones[+e.target.closest('.sec').dataset.s]; const it=s.items[+e.target.closest('.it').dataset.i];
    it.estado=e.target.value; touch(); renderSecciones();
    if(it.estado==='no'||it.estado==='parc'){ const el=document.querySelector(`.sec[data-s="${nota.secciones.indexOf(s)}"] .it[data-i="${s.items.indexOf(it)}"] .mot`); if(el) el.focus(); }
  } else if(e.target.dataset.f==='texto'||e.target.dataset.f==='titulo'){ actualizarListas(); }
});
$('secciones').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const secEl=b.closest('.sec'); const si=+secEl.dataset.s; const s=nota.secciones[si];
  if(b.dataset.act==='addItem'){ s.items.push({id:uid(),cant:'',texto:'',estado:'pend',entregado:'',motivo:''}); renderSecciones(); touch();
    const els=document.querySelectorAll(`.sec[data-s="${si}"] .it`); const last=els[els.length-1]; if(last) last.querySelector('.q').focus(); }
  if(b.dataset.act==='delItem'){ const ii=+b.closest('.it').dataset.i; const it=s.items[ii];
    if((it.texto||it.cant) && !confirm('¿Quitar este material de la nota?')) return;
    s.items.splice(ii,1); renderSecciones(); touch(); }
  if(b.dataset.act==='delSec'){ if(s.items.length && !confirm(`¿Quitar la sección "${s.titulo||'sin nombre'}" con ${s.items.length} material(es)?`)) return;
    nota.secciones.splice(si,1); renderSecciones(); touch(); }
});
$('bAddSec').onclick=()=>{ nota.secciones.push({id:uid(),titulo:'',items:[{id:uid(),cant:'',texto:'',estado:'pend',entregado:'',motivo:''}]}); renderSecciones(); touch();
  const t=document.querySelectorAll('.sec-t'); t[t.length-1].focus(); };
$('bNueva').onclick=()=>{ if(!confirm('Se crea una nota en blanco. La actual queda guardada en el Historial. ¿Continuar?')) return; nota=nuevaNota(false); renderEditor(); toast('Nota nueva creada'); };
$('bDup').onclick=()=>{ const o=nota; const n=nuevaNota(false); n.destinatario=o.destinatario; n.intro=o.intro; n.firma=o.firma;
  n.secciones=o.secciones.map(s=>({id:uid(),titulo:s.titulo,items:s.items.map(it=>({id:uid(),cant:it.cant,texto:it.texto,estado:'pend',entregado:'',motivo:''}))}));
  guardar(); nota=n; renderEditor(); toast('Duplicada con estados en "Pendiente"'); };
$('usuario').addEventListener('input',e=>{ DB.usuario=e.target.value; guardarSoon(); });

/* ---------- impresión: HTML ---------- */
function pagina(contenido, extraCls){
  return `<table class="pg ${extraCls||''}"><thead><tr><td><img class="hdr" src="${IMG_HDR}" alt=""></td></tr></thead>
  <tbody><tr><td class="pb">${contenido}</td></tr></tbody>
  <tfoot><tr><td><div class="ft"><img class="ftr" src="${IMG_FTR}" alt=""><img class="esc" src="${IMG_ESC}" alt=""></div></td></tr></tfoot></table>`;
}
function sufijoEstado(it){
  const st=it.estado||'pend';
  if(st==='ent') return ` <span class="b-ent">— entregado</span>`;
  if(st==='no') return ` <span class="b-no">— NO SE ENTREGÓ. Motivo: ${esc(it.motivo||'(sin motivo)')}</span>`;
  if(st==='parc') return ` <span class="b-parc">— ENTREGA PARCIAL${it.entregado?` (entregaron ${esc(it.entregado)})`:''}. Motivo: ${esc(it.motivo||'(sin motivo)')}</span>`;
  return '';
}
function htmlNota(n){
  const secs=n.secciones.filter(s=>s.items.some(it=>(it.texto||it.cant)));
  const cuerpo = `
    <div class="pn-fecha">LANÚS ${esc(fechaNota(n.fecha))}</div>
    <div class="pn-dest">${esc(n.destinatario)}${/:\s*$/.test(n.destinatario)?'':':'}</div>
    <div class="pn-intro">${esc(n.intro)}</div>
    ${secs.map(s=>`<div class="pn-sec"><h4>${esc(s.titulo||'Sin nombre')}:</h4><ul>${s.items.filter(it=>it.texto||it.cant).map(it=>`<li>${esc(textoItem(it))}${sufijoEstado(it)}</li>`).join('')}</ul></div>`).join('')}
    <div class="pn-firma">${esc(n.firma)}</div>
    ${(n.observaciones||'').trim()?`<div class="pn-obs"><b>Observaciones:</b> ${esc(n.observaciones)}</div>`:''}`;
  return pagina(cuerpo);
}

      return `<tr><td class="num">${k}</td><td>${esc((it.texto||'').trim())}</td><td class="num">${esc(it.cant||'')}</td><td class="${cls}">${ESTADOS[st]}</td><td class="num">${ent}</td><td>${mot}</td></tr>`;
    }).join('');
  }).join('');
  const problemas=[]; n.secciones.forEach(s=>s.items.forEach(it=>{ if(it.estado==='no'||it.estado==='parc') problemas.push({s,it}); }));
  const imps=n.impresiones||[];
  return pagina(`<div class="inf">
    <h2>INFORME DE PEDIDO DE MATERIALES</h2>
    <div class="sub1">Dirección de Ejecución en Red Vial · ${esc(n.destinatario.replace(/:\s*$/,''))}</div>
    <table class="kv">
      <tr><td>Fecha de la nota</td><td>${fechaCorta(n.fecha)} (LANÚS ${esc(fechaNota(n.fecha))})</td></tr>
      <tr><td>Destinatario</td><td>${esc(n.destinatario.replace(/:\s*$/,''))}</td></tr>
      <tr><td>Firma</td><td>${esc(n.firma)}</td></tr>
      <tr><td>Nota creada</td><td>${fechaHora(n.creada)}</td></tr>
      <tr><td>Último cambio</td><td>${fechaHora(n.modificada)}</td></tr>
      <tr><td>Informe emitido</td><td>${fechaHora(ahora)}${DB.usuario?` · por ${esc(DB.usuario)}`:''}</td></tr>
    </table>
    <div class="estado ${eg.cls}">${esc(eg.txt)}</div>
    <h5>Resumen</h5>
    <table><tr><th>Total de ítems</th><th>Entregados</th><th>Entrega parcial</th><th>NO entregados</th><th>Pendientes</th></tr>
      <tr><td class="num">${r.total}</td><td class="num verde">${r.ent}</td><td class="num ambar">${r.parc}</td><td class="num rojo">${r.no}</td><td class="num">${r.pend}</td></tr></table>

    <h5>Materiales NO entregados o entregados en forma parcial</h5>
    ${problemas.length?`<table><thead><tr><th>Cuadrilla</th><th>Material</th><th>Pedido</th><th>Situación</th><th>Motivo</th></tr></thead><tbody>${problemas.map(({s,it})=>`<tr><td>${esc(s.titulo)}</td><td>${esc(it.texto)}</td><td class="num">${esc(it.cant)}</td><td class="${it.estado==='no'?'rojo':'ambar'}">${it.estado==='no'?'NO SE ENTREGÓ':'Parcial'+(it.entregado?' ('+esc(it.entregado)+')':'')}</td><td>${esc(it.motivo||'(SIN MOTIVO)')}</td></tr>`).join('')}</tbody></table>`:'<div style="font-size:9.5pt">Ninguno. No hay materiales sin entregar.</div>'}
    ${(n.observaciones||'').trim()?`<h5>Observaciones</h5><div style="white-space:pre-wrap;font-size:9.5pt">${esc(n.observaciones)}</div>`:''}
    <h5>Registro de impresiones (${imps.length})</h5>
    ${imps.length?`<table><thead><tr><th style="width:8mm">#</th><th style="width:36mm">Fecha y hora</th><th style="width:26mm">Documento</th><th>Imprimió</th><th>Estado al imprimir</th></tr></thead><tbody>${imps.map(p=>`<tr><td class="num">${p.n}</td><td>${fechaHora(p.ts)}</td><td>${p.tipo==='informe'?'Informe':'Nota de pedido'}</td><td>${esc(p.usuario||'—')}</td><td>${p.res.total} ítems: ${p.res.ent} entreg. · ${p.res.parc} parc. · ${p.res.no} NO entreg. · ${p.res.pend} pend.</td></tr>`).join('')}</tbody></table>`:'<div style="font-size:9.5pt">Todavía no se imprimió.</div>'}
    <div class="gen">Informe generado automáticamente por el sistema. Cada impresión de la nota o del informe queda registrada con fecha, hora y estado de cada material.</div>
  </div>`);
}
function renderPrint(){ $('printNota').innerHTML=htmlNota(nota); $('printInforme').innerHTML=htmlInforme(nota); }
function renderInformePrev(){ $('prevInforme').innerHTML=htmlInforme(nota); }

/* ---------- imprimir + registrar ---------- */
let lastReg=0;
function validar(){
  const falt=[]; nota.secciones.forEach((s,si)=>s.items.forEach((it,ii)=>{ if((it.estado==='no'||it.estado==='parc') && !String(it.motivo||'').trim()) falt.push([si,ii,s,it]); }));
  if(falt.length){
    setView('nota'); renderSecciones();
    const [si,ii,s,it]=falt[0];
    const el=document.querySelector(`.sec[data-s="${si}"] .it[data-i="${ii}"] .mot`); if(el){ el.scrollIntoView({block:'center'}); el.focus(); }
    toast(`Falta el MOTIVO de "${it.texto||'un material'}" (${s.titulo||'sin sección'}). Es obligatorio para imprimir.`, true);
    return false;
  }
  const vacios = nota.secciones.reduce((a,s)=>a+s.items.filter(it=>!it.texto&&!it.cant).length,0);
  return true;
}
function registrarImpresion(tipo){
  const snap=clone(nota); delete snap.impresiones;
  nota.impresiones.push({ n:nota.impresiones.length+1, ts:Date.now(), tipo, usuario:DB.usuario||'', res:resumen(nota), snap });
  lastReg=Date.now(); guardar();
}
function imprimir(tipo){
  if(!validar()) return;
  registrarImpresion(tipo);
  document.body.dataset.print=tipo; renderPrint(); renderInformePrev();
  toast('Impresión N° '+nota.impresiones.length+' registrada en el Historial');
  setTimeout(()=>window.print(),80);
}
$('bPrintNota').onclick=()=>imprimir('nota');
$('bPrintInf').onclick=()=>imprimir('informe');
/* Ctrl+P / menú del navegador: también queda registrado */
window.addEventListener('beforeprint',()=>{
  if(Date.now()-lastReg<5000){ return; }
  const tipo = (curView==='informe')?'informe':'nota';
  registrarImpresion(tipo); document.body.dataset.print=tipo; renderPrint();
});

/* ---------- historial ---------- */
function textoBusqueda(n){
  const p=[n.fecha,fechaCorta(n.fecha),n.destinatario,n.observaciones,'nota '+n.num];
  n.secciones.forEach(s=>{ p.push(s.titulo); s.items.forEach(it=>p.push(it.cant,it.texto,ESTADOS[it.estado||'pend'],it.motivo)); });
  return p.join(' ').toLowerCase();
}
function renderHist(){
  const q=($('buscar').value||'').trim().toLowerCase();
  const arr=Object.values(DB.notas).sort((a,b)=>b.num-a.num).filter(n=>!q||textoBusqueda(n).includes(q));
  $('lista').innerHTML = arr.length ? arr.map(n=>{
    const r=resumen(n), eg=estadoGeneral(r), imps=n.impresiones||[], last=imps[imps.length-1];
    const nos=[]; n.secciones.forEach(s=>s.items.forEach(it=>{ if(it.estado==='no') nos.push(`${it.texto} (${s.titulo}): ${it.motivo||'sin motivo'}`); }));
    return `<div class="card" data-id="${n.id}">
      <h3>LANÚS ${esc(fechaNota(n.fecha))} ${n.fecha?n.fecha.slice(0,4):''}${n.id===DB.actual?' <span class="chip pend">en pantalla</span>':''}</h3>
      <div class="meta">${esc(n.destinatario)} · ${r.total} ítem(s) · ${imps.length?`impresa ${imps.length} vez/veces (última: ${fechaHora(last.ts)}${last.usuario?' por '+esc(last.usuario):''})`:'<b>borrador, sin imprimir</b>'}</div>
      <div class="chips"><span class="chip ent">${r.ent} entregados</span><span class="chip parc">${r.parc} parciales</span><span class="chip no">${r.no} NO entregados</span><span class="chip pend">${r.pend} pendientes</span></div>
      ${nos.length?`<div class="meta" style="color:var(--mal)">No entregado: ${nos.map(esc).join(' · ')}</div>`:''}
      <div class="row" style="margin-top:8px"><button class="btn s p" data-a="abrir">Abrir / editar</button><button class="btn s" data-a="informe">Ver informe</button></div>
    </div>`; }).join('') : `<div class="vacio">No hay notas${q?' que coincidan con la búsqueda':''}.</div>`;
}
$('buscar').addEventListener('input',renderHist);
$('lista').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  DB.actual=b.closest('.card').dataset.id; nota=notaActual(); guardar(); renderEditor();
  setView(b.dataset.a==='informe'?'informe':'nota');
});
$('bExp').onclick=()=>{ const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`pedido_materiales_respaldo_${hoy()}.json`; a.click(); toast('Respaldo descargado'); };
$('bImp').onclick=()=>$('fImp').click();
$('fImp').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); let add=0;
      Object.values(d.notas||{}).forEach(n=>{ const ex=DB.notas[n.id];
        if(!ex || (n.impresiones||[]).length>(ex.impresiones||[]).length || (n.impresiones||[]).length===(ex.impresiones||[]).length && n.modificada>ex.modificada){ DB.notas[n.id]=n; add++; } });
      DB.counter=Math.max(DB.counter,d.counter||0,...Object.values(DB.notas).map(n=>n.num)); guardar(); nota=notaActual(); renderHist(); toast(`Importadas/actualizadas: ${add} nota(s)`);
    }catch(err){ toast('El archivo no es un respaldo válido', true); } };
  rd.readAsText(f); e.target.value='';
});

/* ---------- vistas ---------- */
let curView='nota';
function setView(v){
  curView=v;
  ['nota','informe','hist'].forEach(k=>$('v-'+k).style.display=(k===v?'block':'none'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  if(v==='informe') renderInformePrev();
  if(v==='hist') renderHist();
  ajustarZoom(); window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
function ajustarZoom(){
  const w=window.innerWidth-16, hoja=794; // 210mm ≈ 794px
  const z=Math.min(1,w/hoja);
  ['zNota','zInf'].forEach(id=>{ const el=$(id); el.style.zoom = z<1? z : ''; });
}
window.addEventListener('resize',ajustarZoom);

/* ---------- inicio ---------- */
(function init(){
  document.querySelectorAll('.js-hdr').forEach(i=>i.src=IMG_HDR);
  document.querySelectorAll('.js-ftr').forEach(i=>i.src=IMG_FTR);
  document.querySelectorAll('.js-esc').forEach(i=>i.src=IMG_ESC);
  cargar();
  if(!DB.actual || !DB.notas[DB.actual]){
    const ids=Object.keys(DB.notas);
    if(ids.length){ DB.actual=ids.sort((a,b)=>DB.notas[b].num-DB.notas[a].num)[0]; }
    else nuevaNota(true);
  }
  nota=notaActual(); $('usuario').value=DB.usuario||'';
  renderEditor(); renderPrint(); ajustarZoom();
})();
</script>
</body>
</html>
