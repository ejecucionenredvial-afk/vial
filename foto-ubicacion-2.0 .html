<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest-2.0.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Registro fotográfico Lanús 2.0</title>
<style>
  /* Paleta tomada del logo de Lanús Gobierno: celeste y gris carbón */
  :root {
    --cyan: #12a1c4;
    --cyan-d: #0a7c9b;
    --ink: #2b3037;
    --bg: #f2f6f8;
    --surface: #ffffff;
    --muted: #5c6874;
    --line: #d3dde4;
    --btn: #0a7c9b;
    --btn-ink: #ffffff;
    --focus: #12a1c4;
    --chip-bg: #eef3f6;
    --ok: #1f9d5b;
    --warn: #d98a00;
    --bad: #d64545;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eef2;
      --bg: #14191e;
      --surface: #1d242b;
      --muted: #96a4af;
      --line: #2c363e;
      --btn: #0f8fb2;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    height: 100dvh;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }

  /* Barra superior: siempre blanca para que el logo se lea */
  .bar {
    flex: none;
    background: #ffffff; color: #2b3037;
    border-bottom: 3px solid var(--cyan);
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .bar-in { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bar-logo { height: 46px; width: auto; max-width: 62%; display: block; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    padding: 6px 11px; border-radius: 999px;
    background: #eef3f6; border: 1px solid #d3dde4;
    font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; color: #2b3037;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa7b1; }
  .chip.ok .dot { background: var(--ok); }
  .chip.warn .dot { background: var(--warn); }
  .chip.bad .dot { background: var(--bad); }

  /* ---- Cámara en vivo ---- */
  #camView { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #000; }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .live {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: 12px;
    background: rgba(31, 36, 42, .82); color: #fff; border-left: 4px solid var(--cyan);
    padding: 9px 12px; border-radius: 10px;
    font-size: 16px; font-weight: 600; text-align: center;
    overflow-wrap: anywhere;
  }
  .live:empty { display: none; }
  .shutter-row {
    flex: none; background: #1f242a; display: flex; justify-content: center;
    padding-top: 14px; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
  }
  #shutter {
    position: relative; width: 84px; height: 84px; padding: 0; cursor: pointer;
    border-radius: 50%; border: 5px solid #fff; background: transparent;
  }
  #shutter::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
  #shutter:active::after { background: #c3cfda; }
  #shutter:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }

  /* ---- Resultado y respaldo ---- */
  .app {
    flex: 1; width: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 14px; justify-content: center;
    padding-top: 20px;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .has-photo .app { justify-content: flex-start; padding-bottom: 200px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; border: 0; border-radius: 14px; cursor: pointer;
    font: inherit; font-weight: 650; text-align: center;
  }
  .btn svg { width: 28px; height: 28px; flex: none; }
  .btn.camera { height: 112px; font-size: 24px; background: var(--btn); color: var(--btn-ink); }
  .btn.send { height: 88px; font-size: 24px; font-weight: 700; background: var(--btn); color: var(--btn-ink); }
  .btn.send svg { width: 36px; height: 36px; }
  .btn.send:disabled { opacity: .6; cursor: default; }
  .btn.second { height: 50px; font-size: 16px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .hint { margin: 0; text-align: center; font-size: 15px; color: var(--muted); }
  #status { margin: 0; min-height: 1.4em; text-align: center; font-size: 14px; color: var(--muted); }

  #result { display: flex; flex-direction: column; align-items: center; }
  canvas {
    display: block; width: auto; height: auto; max-width: 100%;
    max-height: max(180px, calc(100dvh - 330px));
    border-radius: 8px; background: #fff; border: 1px solid var(--line);
  }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--surface); border-top: 3px solid var(--cyan);
    box-shadow: 0 -6px 18px rgba(31, 36, 42, .14);
    padding-top: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .dock-in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  /* ---- Fotos pendientes (sin internet) ---- */
  .pendbar {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px;
    min-height: 54px; padding: 8px 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: #0a7c9b; color: #fff; font: inherit; font-size: 17px; font-weight: 700; text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .toast {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 82px;
    background: rgba(31, 36, 42, .92); color: #fff; border-left: 4px solid var(--cyan);
    padding: 10px 12px; border-radius: 10px; font-size: 15px; font-weight: 600; text-align: center;
  }
  #pend { display: flex; flex-direction: column; gap: 12px; }
  .pend-title { margin: 0; font-size: 20px; font-weight: 700; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #000; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---- Dirección editable, aviso y giro ---- */
  .addr-edit { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .addr-edit label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .addr-edit input, .plist input {
    width: 100%; height: 50px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .addr-edit input:focus-visible, .plist input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #result canvas { max-height: max(160px, calc(100dvh - 420px)); }
  .review {
    position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 74px;
    border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer;
    background: rgba(31, 36, 42, .78); color: #fff; font: inherit; font-size: 13px; font-weight: 600;
  }
  .review[aria-pressed="true"] { background: #0a7c9b; }
  .plist { display: flex; flex-direction: column; gap: 10px; }
  .pend-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; }
  .pend-row img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #000; }

  /* Celular de costado: botón de disparo a la derecha y botones de envío en columna */
  @media (orientation: landscape) and (max-height: 520px) {
    #camView { flex-direction: row; }
    .shutter-row { flex-direction: column; justify-content: center; padding: 0 max(18px, env(safe-area-inset-right, 0px)) 0 18px; }
    .has-photo .app { max-width: none; padding-right: 330px; padding-bottom: 20px; }
    #result canvas { max-height: calc(100dvh - 190px); }
    .dock { left: auto; width: 310px; border-left: 3px solid var(--cyan); border-top: 0; top: auto; }
    .dock-in { max-width: none; }
    .live { font-size: 14px; }
    .review { top: auto; bottom: 12px; }
  }

  /* ---- Cartel de bloqueo: ubicación y orientación ---- */
  .gate {
    position: fixed; inset: 0; z-index: 100; overflow-y: auto;
    background: #1f242a; color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .gate-in { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
  .gate-ico { width: 76px; height: 76px; border-radius: 20px; background: #12a1c4; display: grid; place-items: center; }
  .gate-ico svg { width: 46px; height: 46px; }
  .gate h2 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .gate p { margin: 0; font-size: 18px; line-height: 1.4; color: #dbe7ee; }
  .gate ol { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 10px; font-size: 17px; line-height: 1.4; color: #fff; }
  .gate .btn { height: 72px; font-size: 21px; background: #12a1c4; color: #0b1a22; }
  .gate .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .gate-skip { background: none; border: 0; color: #9fb4c2; font: inherit; font-size: 15px; text-decoration: underline; cursor: pointer; padding: 10px; align-self: center; }
</style>
</head>

<!-- Cámara en vivo: un toque en el botón saca la foto y abre el envío -->
<section id="camView" aria-label="Cámara">
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="live" id="liveAddr" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <button class="review" id="review" type="button" aria-pressed="false">Revisar antes de enviar: NO</button>
    <button class="pendbar" id="pendBar" type="button" hidden></button>
  </div>
  <div class="shutter-row">
    <button id="shutter" type="button" aria-label="Sacar foto"></button>
  </div>
</section>

<main class="app" id="appView" hidden>
  <!-- Respaldo: cámara del celular si la cámara dentro de la app no se puede abrir -->
  <div id="fallback" hidden style="display:flex;flex-direction:column;gap:14px">
    <label class="btn camera" for="cam" role="button" tabindex="0" id="camBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>
      Sacar foto
    </label>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <p class="hint" id="hint">La dirección sale grabada en la foto.</p>
    <button class="btn second" id="pendBar2" type="button" hidden></button>
  </div>

  <section id="result" hidden aria-label="Foto lista para enviar">
    <canvas id="canvas" aria-label="Foto con ubicación"></canvas>
    <div class="addr-edit">
      <label for="addrEdit">Dirección (podés corregirla)</label>
      <input id="addrEdit" type="text" maxlength="140" autocomplete="off" placeholder="Buscando dirección…">
    </div>
    <div class="dock">
      <div class="dock-in">
        <button class="btn send" id="send" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>
          <span id="sendTxt">Preparando…</span>
        </button>
        <button class="btn second" id="again" type="button">Sacar otra foto</button>
      </div>
    </div>
  </section>

  <section id="pend" hidden aria-label="Fotos pendientes">
    <h2 class="pend-title" id="pendTitle"></h2>
    <div class="thumbs" id="thumbs"></div>
    <div class="dock">
      <div class="dock-in">
        <button class="btn send" id="pendSend" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>
          <span id="pendSendTxt">Preparando…</span>
        </button>
        <div class="row2">
          <button class="btn second" id="pendBack" type="button">Volver a la cámara</button>
          <button class="btn second" id="pendDel" type="button">Borrar</button>
        </div>
      </div>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<div class="gate" id="gate" role="alertdialog" aria-labelledby="gateTitle" aria-live="assertive" hidden>
  <div class="gate-in">
    <div class="gate-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b1a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg>
    </div>
    <h2 id="gateTitle">Activá la ubicación y la orientación del celular</h2>
    <p id="gateText"></p>
    <ol id="gateSteps"></ol>
    <button class="btn" id="gateRetry" type="button">Ya lo activé</button>
    <button class="gate-skip" id="gateSkip" type="button" hidden>Seguir de todos modos</button>
  </div>
</div>

  /* Dirección aproximada desde OpenStreetMap. Sin internet, la foto sale con coordenadas. */

    if (wait > 0) await new Promise(function (r) { setTimeout(r, wait); });

    var to = setTimeout(function () { ctl.abort(); }, 5000);

      var j = await r.json();
      var a = j.address || {};
      var street = [a.road, a.house_number].filter(Boolean).join(' ');
      var place = a.suburb || a.neighbourhood || a.city_district || '';
      var city = a.city || a.town || a.village || a.municipality || '';

  }

    else liveAddr.textContent = addr;

  /* ---------- Foto sellada ---------- */
  function wrap(ctx, text, maxW) {
    var words = text.split(/\s+/), out = [], line = '';
    words.forEach(function (w) {
      var t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else { line = t; }
    });
    if (line) out.push(line);

  }

  function drawStamp(cv, src, sh) {
    var nw = src.w, nh = src.h;
    var k = Math.min(1, 1600 / Math.max(nw, nh));
    var w = Math.round(nw * k), h = Math.round(nh * k);

    /* Franja blanca arriba con el logo; la foto queda entera debajo */
    var hasLogo = logoImg && logoImg.complete && logoImg.naturalWidth > 0;
    var bandH = hasLogo ? Math.round(Math.min(w, h) * 0.16) : 0;
    cv.width = w; cv.height = h + bandH;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(src.el, 0, bandH, w, h);
    if (hasLogo) {
      var lh = Math.round(bandH * 0.70), lw = Math.round(logoImg.naturalWidth * lh / logoImg.naturalHeight);
      var m = Math.round((bandH - lh) / 2);
      ctx.drawImage(logoImg, m + Math.round(bandH * 0.08), m, lw, lh);
      ctx.fillStyle = '#12a1c4';
      ctx.fillRect(0, bandH - Math.max(3, Math.round(bandH * 0.04)), w, Math.max(3, Math.round(bandH * 0.04)));
    }
    if (bandH) {

      ctx.fillStyle = '#2b3037';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(fmtDate(sh.when), w - Math.round(bandH * 0.22), Math.round(bandH * 0.48));
      ctx.textAlign = 'left';
    }

    var fs = Math.max(15, Math.round(Math.min(w, h) * 0.034));
    var pad = Math.round(fs * 0.75), maxW = w - pad * 2, rows = [];

    function add(text, size, weight, color, gap) {
      var px = Math.round(fs * size);
      ctx.font = weight + ' ' + px + 'px ' + FONT;
      wrap(ctx, text, maxW).forEach(function (t) { rows.push({ t: t, px: px, w: weight, c: color, gap: 0 }); });
      if (gap && rows.length) rows[rows.length - 1].gap = Math.round(fs * gap);
    }

    add('MUNICIPALIDAD DE LANÚS', 0.72, 700, '#7fd3e8', 0.25);
    if (sh.address) {
      add(sh.address, 1.15, 700, '#ffffff', 0);
    } else if (sh.done) {
      /* Sin internet no hay dirección: se graban las coordenadas para que la foto no quede sin ubicación */
      add(sh.pos
        ? sh.pos.lat.toFixed(6) + ', ' + sh.pos.lon.toFixed(6)

    if (sh.pos && sh.pos.t && sh.when.getTime() - sh.pos.t > FRESH) {
      add('Última ubicación conocida · hace ' + ago(sh.when.getTime() - sh.pos.t), 0.8, 400, '#f5d98a', 0);
    }

    var total = 0;
    rows.forEach(function (r) { total += Math.round(r.px * 1.3) + r.gap; });
    var accent = Math.max(4, Math.round(fs * 0.22));

    ctx.fillStyle = 'rgba(31,36,42,0.88)';
    ctx.fillRect(0, top, w, panelH);
    ctx.fillStyle = '#12a1c4';
    ctx.fillRect(0, top, w, accent);

    var y = top + accent + pad;
    rows.forEach(function (r) {
      ctx.font = r.w + ' ' + r.px + 'px ' + FONT;
      ctx.fillStyle = r.c;
      ctx.fillText(r.t, pad, y);
      y += Math.round(r.px * 1.3) + r.gap;
    });
  }

    if (!source || !shot) return;

  /* ---------- Fotos pendientes: se guardan en el celular y se envían cuando vuelve internet ---------- */
  var qOk = !!window.indexedDB, pendCount = 0;

      r.onsuccess = function () { res(r.result); };

    if (!qOk) return;

    pendBar.hidden = pendBar2.hidden = pendCount === 0;

      var blob = await srcToBlob(src);
      await qAdd({ blob: blob, when: when.getTime(), pos: pos ? { lat: pos.lat, lon: pos.lon, acc: pos.acc, t: pos.t } : null });
    } catch (e) { qOk = false; return false; }

  }

    pendSend.disabled = !enabled && !retry;

    pendSendTxt.textContent = text;
  }
  function renderThumbs() {
    pendUrls.forEach(function (u) { URL.revokeObjectURL(u); }); pendUrls = [];
    var box = $('thumbs'); box.className = 'thumbs'; box.textContent = '';
    pendItems.forEach(function (it) {

  /* Con internet: busca la dirección de cada foto, arma el sello y deja todo listo para un solo envío */
  async function stampPending(it, i) {

    var blob = await new Promise(function (r) { cv.toBlob(r, 'image/jpeg', 0.88); });

  function renderPendList() {
    var box = $('thumbs'); box.className = 'plist'; box.textContent = '';
    pendItems.forEach(function (it, i) {
      var row = document.createElement('div'); row.className = 'pend-row';
      var im = new Image(); im.alt = 'Foto pendiente'; im.src = pendUrls[i] || '';

      inp.value = it.addr || ''; inp.setAttribute('aria-label', 'Dirección de la foto ' + (i + 1));

      var it = pendItems[i], addr = '';
      if (it.pos) {

          setStatus('Todavía no hay internet. Cuando vuelva la conexión, tocá Reintentar.');
          setPend(false, 'Reintentar', true);
          return;
        }
      }
      it.img = await loadBlobImage(it.blob); it.addr = addr;
      pendFiles.push(await stampPending(it, i));
    }
    if (run !== pendRun) return;
    renderPendList();
    setStatus('');
    setPend(true, pendFiles.length === 1 ? 'Enviar 1 foto por WhatsApp' : 'Enviar ' + pendFiles.length + ' fotos por WhatsApp');
  }
  pendSend.addEventListener('click', async function () {
    if (pendSend.dataset.mode === 'retry') { pendPrepare(++pendRun); return; }
    var files = pendFiles.slice();
    if (!files.length) return;
    if (navigator.canShare && navigator.canShare({ files: files })) {
      try {
        await navigator.share({ files: files });
        try { await qDel(pendItems.map(function (i) { return i.id; })); } catch (e) { /* ignorar */ }
        pendItems = []; pendFiles = [];
        await refreshPending();
        toCamera();
        toast('Fotos enviadas.');
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    files.forEach(function (f, i) { setTimeout(function () { saveBlob(f, f.name); }, i * 400); });
    window.open('https://wa.me/', '_blank');
    setStatus('Este navegador no adjunta varias fotos juntas. Quedaron guardadas en tu galería: elegilas dentro del chat de WhatsApp.');
  });
  $('pendBack').addEventListener('click', function () { pendRun++; refreshPending(); toCamera(); });
  pendDel.addEventListener('click', async function () {
    if (pendDel.textContent === 'Borrar') {
      pendDel.textContent = '¿Seguro? Tocá de nuevo';
      clearTimeout(delTimer);
      delTimer = setTimeout(function () { pendDel.textContent = 'Borrar'; }, 4000);
      return;
    }
    pendRun++;
    try { await qDel(pendItems.map(function (i) { return i.id; })); } catch (e) { /* ignorar */ }
    pendItems = [];
    await refreshPending();
    toCamera();
  });
  pendBar.addEventListener('click', openPend);
  pendBar2.addEventListener('click', openPend);

  window.addEventListener('online', function () {
    geoTry = 0;
    refreshPending().then(function () {
      if (pendCount > 0 && view === 'cam') toast('Volvió internet: tenés ' + pendCount + (pendCount === 1 ? ' foto' : ' fotos') + ' para enviar.');
    });
    updateLive(); warmGeo();
  });
  window.addEventListener('offline', updateLive);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshPending(); });

  /* Arma el sello y, apenas está lista la foto, intenta abrir el menú de compartir */
  async function begin(src, when) {
    source = src;
    var pos = (lastPos && Date.now() - lastPos.t < FRESH) ? (bestPos() || lastPos) : await getFix();
    var cached = pos && ((lastHere && dist(lastHere, pos) < 15) || (lastGeo && dist(lastGeo, pos) < 40));
    /* Sin internet y sin dirección a mano: se guarda y se envía después */
    if (!cached && navigator.onLine === false &&
        await queueShot(src, when, pos, 'Sin internet: foto guardada. Se envía cuando vuelva la conexión.')) return;
    var mine = { when: when, pos: pos, address: '', done: false, edited: false };
    shot = mine;
    addrEdit.value = '';
    show('result');
    setReady(false);
    render();
    setStatus(pos ? '' : 'No se pudo obtener la ubicación. Probá de nuevo con mejor señal de GPS.');
    window.scrollTo(0, 0);
    var t = pos ? await geocodeBest(pos) : '';
    if (shot !== mine) return;
    /* Hay ubicación pero no se pudo obtener la dirección (mala señal): también se guarda para después */
    if (!t && pos && await queueShot(src, when, pos, 'No se pudo obtener la dirección: foto guardada para enviar después.')) return;
    if (!mine.edited) { mine.address = t || ''; addrEdit.value = mine.address; }
    mine.done = true;
    render();
    setReady(true);
    if (!reviewOn) shareNow(true);
  }

  /* Foto desde la cámara en vivo */
  function shoot() {
    if (busy || !stream || !video.videoWidth || !gateEl.hidden) return;
    busy = true;
    var when = new Date();
    var c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    stopCam();
    begin({ el: c, w: c.width, h: c.height }, when).then(function () { busy = false; }, function () { busy = false; });
  }
  shutter.addEventListener('click', shoot);

  /* Foto desde la cámara del celular (respaldo) */
  cam.addEventListener('change', function () {
    var f = cam.files && cam.files[0];
    if (!f) return;
    setStatus('Procesando foto…');
    var when = new Date();
    var u = URL.createObjectURL(f);
    var i = new Image();
    i.onload = function () {
      begin({ el: i, w: i.naturalWidth, h: i.naturalHeight }, when);
    };
    i.onerror = function () { setStatus('No se pudo procesar la foto. Intentá de nuevo.'); };
    i.src = u;
    cam.value = '';
  });
  camBtn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cam.click(); }
  });

  /* ---------- Enviar por WhatsApp (menú de compartir) ---------- */
  function getBlob() {
    return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.88); });
  }
  function messageText() { return shot.address || ''; }
  function saveBlob(blob, name) {
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }

  /* auto = true: intento al terminar de preparar la foto. Si el navegador lo bloquea, queda el cartel. */
  async function shareNow(auto) {
    if (!source || !shot) return;
    var blob = await getBlob();
    var file = new File([blob], fileName(shot.when), { type: 'image/jpeg' });
    var text = messageText();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      var data = { files: [file] };
      if (text) data.text = text;
      try { await navigator.share(data); toCamera(); return; }
      catch (e) { if (auto || (e && e.name === 'AbortError')) return; }
    }
    if (auto) return;
    saveBlob(blob, file.name);
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    setStatus('Este navegador no adjunta la foto directo. Quedó guardada: elegila dentro del chat de WhatsApp.');
  }
  send.addEventListener('click', function () { shareNow(false); });

  /* Después de enviar, o con "Sacar otra foto", vuelve la cámara lista para el siguiente disparo */
  function toCamera() {
    source = null; shot = null; busy = false;
    setStatus('');
    if (camOk) { show('cam'); startCam(); }
    else { show('fallback'); }
  }
  $('again').addEventListener('click', function () {
    toCamera();
    if (!camOk) cam.click();
  });

  if (logoImg && !logoImg.complete) logoImg.addEventListener('load', render);
  refreshPending();
  startCam();
})();
</script>
</body>
</html>
