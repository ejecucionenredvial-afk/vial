<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Registro fotográfico Lanús</title>
<style>
  /* Tres pantallas: cámara en vivo, foto lista para enviar, y respaldo con la cámara del celular */
  :root {
    --bar: #1a3a5c;
    --bg: #f4f6f9;
    --surface: #ffffff;
    --ink: #1a2533;
    --muted: #5a6b7d;
    --line: #c8d4e0;
    --btn: #1a3a5c;
    --btn-ink: #ffffff;
    --send: #2d6a4f;
    --send-ink: #ffffff;
    --focus: #2c5f8a;
    --chip-ok: #5fd48f;
    --chip-warn: #f5b84a;
    --chip-bad: #ff8a80;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720;
      --surface: #17212c;
      --ink: #e6edf3;
      --muted: #92a3b5;
      --line: #2a3a4a;
      --btn: #2c6aa3;
      --send: #2a7d56;
      --focus: #7db4e6;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    height: 100dvh;
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }

  .bar {
    flex: none;
    background: var(--bar); color: #fff;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .bar-in { max-width: 480px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .mark {
    width: 42px; height: 42px; flex: none; border-radius: 10px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
    display: grid; place-items: center;
  }
  .mark svg { width: 24px; height: 24px; }
  .titles { flex: 1 1 170px; min-width: 0; }
  .eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #a9c8e6; }
  h1 { margin: 1px 0 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    padding: 6px 11px; border-radius: 999px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
    font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; color: #fff;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #b8c7d6; }
  .chip.ok .dot { background: var(--chip-ok); }
  .chip.warn .dot { background: var(--chip-warn); }
  .chip.bad .dot { background: var(--chip-bad); }

  /* ---- Cámara en vivo ---- */
  #camView { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #000; }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .live {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: 12px;
    background: rgba(10, 26, 44, .78); color: #fff;
    padding: 9px 12px; border-radius: 10px;
    font-size: 16px; font-weight: 600; text-align: center;
    overflow-wrap: anywhere;
  }
  .live:empty { display: none; }
  .shutter-row {
    flex: none; background: #0b1622; display: flex; justify-content: center;
    padding-top: 14px; padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
  }
  #shutter {
    position: relative; width: 84px; height: 84px; padding: 0; cursor: pointer;
    border-radius: 50%; border: 5px solid #fff; background: transparent;
  }
  #shutter::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
  #shutter:active::after { background: #c3cfda; }
  #shutter:focus-visible { outline: 3px solid #7db4e6; outline-offset: 4px; }

  /* ---- Resultado y respaldo ---- */
  .app {
    flex: 1; width: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 14px; justify-content: center;
    padding-top: 20px;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .has-photo .app { justify-content: flex-start; padding-bottom: 200px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; border: 0; border-radius: 14px; cursor: pointer;
    font: inherit; font-weight: 650; text-align: center;
  }
  .btn svg { width: 28px; height: 28px; flex: none; }
  .btn.camera { height: 112px; font-size: 24px; background: var(--btn); color: var(--btn-ink); }
  .btn.send { height: 88px; font-size: 24px; font-weight: 700; background: var(--send); color: var(--send-ink); }
  .btn.send svg { width: 36px; height: 36px; }
  .btn.send:disabled { opacity: .6; cursor: default; }
  .btn.second { height: 50px; font-size: 16px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .hint { margin: 0; text-align: center; font-size: 15px; color: var(--muted); }
  #status { margin: 0; min-height: 1.4em; text-align: center; font-size: 14px; color: var(--muted); }

  #result { display: flex; flex-direction: column; align-items: center; }
  canvas {
    display: block; width: auto; height: auto; max-width: 100%;
    max-height: max(180px, calc(100dvh - 330px));
    border-radius: 8px; background: #000; border: 1px solid var(--line);
  }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -6px 18px rgba(10, 26, 44, .14);
    padding-top: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .dock-in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg>
    </div>
    <div class="titles">
      <p class="eyebrow">Municipalidad de Lanús</p>
      <h1>Registro fotográfico</h1>
    </div>
    <span id="gps" class="chip"><span class="dot"></span><span id="gpsTxt">Buscando GPS…</span></span>
  </div>
</header>

<!-- Cámara en vivo: un toque en el botón saca la foto y abre el envío -->
<section id="camView" aria-label="Cámara">
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="live" id="liveAddr" aria-live="polite"></div>
  </div>
  <div class="shutter-row">
    <button id="shutter" type="button" aria-label="Sacar foto"></button>
  </div>
</section>

<main class="app" id="appView" hidden>
  <!-- Respaldo: cámara del celular si la cámara dentro de la app no se puede abrir -->
  <div id="fallback" hidden style="display:flex;flex-direction:column;gap:14px">
    <label class="btn camera" for="cam" role="button" tabindex="0" id="camBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>
      Sacar foto
    </label>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <p class="hint" id="hint">La dirección sale grabada en la foto.</p>
  </div>

  <section id="result" hidden aria-label="Foto lista para enviar">
    <canvas id="canvas" aria-label="Foto con ubicación"></canvas>
    <div class="dock">
      <div class="dock-in">
        <button class="btn send" id="send" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg>
          <span id="sendTxt">Preparando…</span>
        </button>
        <button class="btn second" id="again" type="button">Sacar otra foto</button>
      </div>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
(function () {
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), shutter = $('shutter'), liveAddr = $('liveAddr');
  var camView = $('camView'), appView = $('appView'), fallbackBox = $('fallback'), result = $('result');
  var cam = $('cam'), camBtn = $('camBtn'), canvas = $('canvas'), send = $('send'), sendTxt = $('sendTxt');
  var chip = $('gps'), chipTxt = $('gpsTxt'), statusEl = $('status');
  var FONT = '"Segoe UI", Roboto, system-ui, -apple-system, sans-serif';

  var stream = null, view = 'cam', camOk = true, busy = false;
  var source = null, shot = null, lastPos = null, lastGeo = null, geoBusy = false, geoTry = 0;

  function setGps(state, text) { chip.className = 'chip ' + state; chipTxt.textContent = text; }
  function setStatus(t) { statusEl.textContent = t || ''; }
  function p2(n) { return String(n).padStart(2, '0'); }
  function fileName(d) {
    return 'lanus_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' +
           p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + '.jpg';
  }
  function setReady(ok) {
    send.disabled = !ok;
    sendTxt.textContent = ok ? 'Enviar por WhatsApp' : 'Preparando…';
  }

  /* ---------- Pantallas ---------- */
  function show(v) {
    view = v;
    camView.hidden = v !== 'cam';
    appView.hidden = v === 'cam';
    fallbackBox.hidden = v !== 'fallback';
    result.hidden = v !== 'result';
    document.body.classList.toggle('has-photo', v === 'result');
    if (v === 'cam') setStatus('');
  }

  /* ---------- Cámara dentro de la app ---------- */
  function stopCam() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
  }
  function useFallback(msg) {
    camOk = false;
    stopCam();
    show('fallback');
    setStatus(msg || '');
  }
  async function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return useFallback('Este navegador no deja abrir la cámara dentro de la app. Usá la cámara del celular.');
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      try { await video.play(); } catch (e) { /* autoplay ya lo maneja el atributo */ }
      camOk = true;
      show('cam');
      updateLive();
    } catch (e) {
      useFallback(e && e.name === 'NotAllowedError'
        ? 'Permití el acceso a la cámara para este sitio, o usá la cámara del celular.'
        : 'No se pudo abrir la cámara. Usá la cámara del celular.');
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || view !== 'cam' || !camOk) return;
    var alive = stream && stream.getTracks().some(function (t) { return t.readyState === 'live'; });
    if (!alive) { stopCam(); startCam(); }
  });

  /* ---------- Ubicación automática ---------- */
  function onPos(p) {
    lastPos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    setGps(p.coords.accuracy <= 30 ? 'ok' : 'warn', 'GPS ±' + Math.round(p.coords.accuracy) + ' m');
    warmGeo();
    updateLive();
  }
  function onErr(e) {
    if (e && e.code === 1) {
      setGps('bad', 'Ubicación bloqueada');
      liveAddr.textContent = 'Activá el permiso de ubicación del navegador para este sitio.';
    } else if (!lastPos) {
      setGps('warn', 'Buscando GPS…');
    }
  }
  if (!window.isSecureContext) {
    setGps('bad', 'Sin HTTPS');
  } else if (!navigator.geolocation) {
    setGps('bad', 'Sin GPS');
  } else {
    navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }

  function getFix() {
    if (lastPos && Date.now() - lastPos.t < 60000) return Promise.resolve(lastPos);
    return new Promise(function (resolve) {
      var fallback = function () {
        resolve(lastPos && Date.now() - lastPos.t < 600000 ? lastPos : null);
      };
      if (!navigator.geolocation) return fallback();
      navigator.geolocation.getCurrentPosition(
        function (p) { onPos(p); resolve(lastPos); },
        fallback,
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  function dist(a, b) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    var x = Math.pow(Math.sin(dLat / 2), 2) +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  /* Dirección aproximada desde OpenStreetMap. Sin internet, la foto sale con coordenadas. */
  async function geocode(pos) {
    if (lastGeo && dist(lastGeo, pos) < 40) return lastGeo.text;
    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 5000);
    try {
      var url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=es' +
                '&lat=' + pos.lat + '&lon=' + pos.lon;
      var r = await fetch(url, { signal: ctl.signal });
      var j = await r.json();
      var a = j.address || {};
      var street = [a.road, a.house_number].filter(Boolean).join(' ');
      var place = a.suburb || a.neighbourhood || a.city_district || '';
      var city = a.city || a.town || a.village || a.municipality || '';
      var text = [street, place, city].filter(Boolean).join(', ');
      if (text) { lastGeo = { lat: pos.lat, lon: pos.lon, text: text }; return text; }
    } catch (e) { /* sin red: se omite la dirección */ }
    finally { clearTimeout(to); }
    return '';
  }

  /* La dirección se busca de antemano, mientras se ve la cámara, para que al sacar la foto ya esté lista */
  function warmGeo() {
    if (!lastPos || geoBusy) return;
    if (lastGeo && dist(lastGeo, lastPos) < 40) return;
    if (Date.now() - geoTry < 10000) return;
    geoBusy = true; geoTry = Date.now();
    geocode(lastPos).then(function () { geoBusy = false; updateLive(); });
  }
  function updateLive() {
    if (view !== 'cam') return;
    if (!lastPos) { liveAddr.textContent = 'Buscando ubicación…'; return; }
    if (lastGeo && dist(lastGeo, lastPos) < 60) liveAddr.textContent = lastGeo.text;
    else liveAddr.textContent = 'Buscando dirección…';
  }

  /* ---------- Foto sellada ---------- */
  function wrap(ctx, text, maxW) {
    var words = text.split(/\s+/), out = [], line = '';
    words.forEach(function (w) {
      var t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else { line = t; }
    });
    if (line) out.push(line);
    return out;
  }

  function render() {
    if (!source || !shot) return;
    var nw = source.w, nh = source.h;
    var k = Math.min(1, 1600 / Math.max(nw, nh));
    var w = Math.round(nw * k), h = Math.round(nh * k);
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(source.el, 0, 0, w, h);
    ctx.textBaseline = 'top';

    var fs = Math.max(15, Math.round(Math.min(w, h) * 0.034));
    var pad = Math.round(fs * 0.75), maxW = w - pad * 2, rows = [];

    function add(text, size, weight, color, gap) {
      var px = Math.round(fs * size);
      ctx.font = weight + ' ' + px + 'px ' + FONT;
      wrap(ctx, text, maxW).forEach(function (t) { rows.push({ t: t, px: px, w: weight, c: color, gap: 0 }); });
      if (gap && rows.length) rows[rows.length - 1].gap = Math.round(fs * gap);
    }

    add('MUNICIPALIDAD DE LANÚS', 0.72, 700, '#9cc3e6', 0.25);
    if (shot.address) {
      add(shot.address, 1.15, 700, '#ffffff', 0);
    } else if (shot.done) {
      /* Sin internet no hay dirección: se graban las coordenadas para que la foto no quede sin ubicación */
      add(shot.pos
        ? shot.pos.lat.toFixed(6) + ', ' + shot.pos.lon.toFixed(6)
        : 'Ubicación no disponible', 1.0, 700, '#ffffff', 0);
    }

    var total = 0;
    rows.forEach(function (r) { total += Math.round(r.px * 1.3) + r.gap; });
    var accent = Math.max(4, Math.round(fs * 0.22));
    var panelH = total + pad * 2 + accent;

    ctx.fillStyle = 'rgba(10,26,44,0.86)';
    ctx.fillRect(0, h - panelH, w, panelH);
    ctx.fillStyle = '#4a90d0';
    ctx.fillRect(0, h - panelH, w, accent);

    var y = h - panelH + accent + pad;
    rows.forEach(function (r) {
      ctx.font = r.w + ' ' + r.px + 'px ' + FONT;
      ctx.fillStyle = r.c;
      ctx.fillText(r.t, pad, y);
      y += Math.round(r.px * 1.3) + r.gap;
    });
  }

  /* Arma el sello y, apenas está lista la foto, intenta abrir el menú de compartir */
  async function begin(src, when) {
    source = src;
    var pos = (lastPos && Date.now() - lastPos.t < 600000) ? lastPos : await getFix();
    var mine = { when: when, pos: pos, address: '', done: false };
    shot = mine;
    show('result');
    setReady(false);
    render();
    setStatus(pos ? '' : 'No se pudo obtener la ubicación. Probá de nuevo con mejor señal de GPS.');
    window.scrollTo(0, 0);
    var t = pos ? await geocode(pos) : '';
    if (shot !== mine) return;
    mine.address = t || '';
    mine.done = true;
    render();
    setReady(true);
    shareNow(true);
  }

  /* Foto desde la cámara en vivo */
  function shoot() {
    if (busy || !stream || !video.videoWidth) return;
    busy = true;
    var when = new Date();
    var c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    stopCam();
    begin({ el: c, w: c.width, h: c.height }, when).then(function () { busy = false; }, function () { busy = false; });
  }
  shutter.addEventListener('click', shoot);

  /* Foto desde la cámara del celular (respaldo) */
  cam.addEventListener('change', function () {
    var f = cam.files && cam.files[0];
    if (!f) return;
    setStatus('Procesando foto…');
    var when = new Date();
    var u = URL.createObjectURL(f);
    var i = new Image();
    i.onload = function () {
      begin({ el: i, w: i.naturalWidth, h: i.naturalHeight }, when);
    };
    i.onerror = function () { setStatus('No se pudo procesar la foto. Intentá de nuevo.'); };
    i.src = u;
    cam.value = '';
  });
  camBtn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cam.click(); }
  });

  /* ---------- Enviar por WhatsApp (menú de compartir) ---------- */
  function getBlob() {
    return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.88); });
  }
  function messageText() { return shot.address || ''; }
  function saveBlob(blob, name) {
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }

  /* auto = true: intento al terminar de preparar la foto. Si el navegador lo bloquea, queda el cartel. */
  async function shareNow(auto) {
    if (!source || !shot) return;
    var blob = await getBlob();
    var file = new File([blob], fileName(shot.when), { type: 'image/jpeg' });
    var text = messageText();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      var data = { files: [file] };
      if (text) data.text = text;
      try { await navigator.share(data); toCamera(); return; }
      catch (e) { if (auto || (e && e.name === 'AbortError')) return; }
    }
    if (auto) return;
    saveBlob(blob, file.name);
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    setStatus('Este navegador no adjunta la foto directo. Quedó guardada: elegila dentro del chat de WhatsApp.');
  }
  send.addEventListener('click', function () { shareNow(false); });

  /* Después de enviar, o con "Sacar otra foto", vuelve la cámara lista para el siguiente disparo */
  function toCamera() {
    source = null; shot = null; busy = false;
    setStatus('');
    if (camOk) { show('cam'); startCam(); }
    else { show('fallback'); }
  }
  $('again').addEventListener('click', function () {
    toCamera();
